<!DOCTYPE html>
<html lang="id" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>TopCare AI — Platform AI untuk Belajar & Berkembang</title>

    <!-- OPTIMASI PERFORMANCE HP: Preconnect & Font Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="assets/images/favicon.ico">

    <!-- MASTER STYLESHEET BUNDLE -->
    <link rel="stylesheet" href="assets/css/app.css">
    <link rel="stylesheet" href="assets/css/components/navbar/navbar.css">
    <link rel="stylesheet" href="assets/css/components/image-utilities.css">
    <script>
        // Route-only styles: keep non-active feature CSS out of the initial render path.
        (function () {
            const routeStyles = {
                community: 'assets/css/pages/community.css',
                premium: 'assets/css/pages/premium.css'
            };

            function updateRouteStyles() {
                const route = (window.location.hash || '#/home').replace(/^#\//, '').split('/')[0];
                Object.entries(routeStyles).forEach(([name, href]) => {
                    const id = `tc-route-style-${name}`;
                    const existing = document.getElementById(id);
                    if (name === route && !existing) {
                        const link = document.createElement('link');
                        link.id = id;
                        link.rel = 'stylesheet';
                        link.href = href;
                        document.head.appendChild(link);
                    }
                    if (name !== route && existing) existing.remove();
                });
            }

            updateRouteStyles();
            window.addEventListener('hashchange', updateRouteStyles);
        }());
    </script>
</head>

<body class="app-shell">

    <a href="#app" class="skip-link">Lewati ke konten utama</a>

    <!-- Global Application Header Navigation -->
    <header class="header-section" role="banner" id="site-header">
        <div class="header-container">
            <!-- Brand Logo -->
            <a href="#/home" class="header-brand" aria-label="TopCare AI Beranda">
                <img src="assets/images/logos/logo-utama.webp" alt="TopCare AI Logo" class="header-logo" width="140"
                    height="40" decoding="async">
            </a>

            <!-- Navigasi Utama Terstruktur SSOT -->
            <nav class="header-nav" id="main-nav" aria-label="Navigasi Utama">
                <a href="#/home" class="header-nav-link active" data-route="home">Beranda</a>
                <a href="#/learning" class="header-nav-link" data-route="learning">Belajar</a>

                <!-- DROPDOWN SUBMENU CREATOR -->
                <!-- Cukup gunakan link biasa agar langsung membuka halaman Creator -->
                <a href="#/creator" class="header-nav-link" data-route="creator">Creator</a>
                <a href="#/community" class="header-nav-link" data-route="community">Komunitas</a>
                <a href="#/marketplace" class="header-nav-link" data-route="marketplace">Marketplace</a>
                <a href="#/premium" class="header-nav-link" data-route="premium">Premium</a>
                <a href="#/about" class="header-nav-link" data-route="about">Tentang Kami</a>
            </nav>

            <!-- Aksi & Pemilih Bahasa -->
            <div class="header-actions">
                <div class="lang-selector">
                    <button class="lang-btn" id="lang-toggle-btn" aria-label="Pilih Bahasa">
                        <span>🇮🇩 ID</span>
                    </button>
                </div>

                <a href="#/login" class="header-nav-link" data-i18n="nav_login">Masuk</a>
                <a href="#/register" class="btn-primary" data-i18n="nav_register">Mulai Gratis</a>
            </div>

            <!-- Tombol Garis 3 untuk Mobile Navigation -->
            <button class="mobile-menu-toggle" id="mobile-menu-btn" aria-label="Buka Menu Navigasi"
                aria-expanded="false">
                <span class="hamburger-bar"></span>
                <span class="hamburger-bar"></span>
                <span class="hamburger-bar"></span>
            </button>
        </div>
    </header>

    <!-- SINGLE DYNAMIC MOUNT POINT -->
    <main id="app" class="app-view-viewport" role="main"></main>

    <!-- Lightweight mobile navigation initializer -->
    <script>
        // Fast Mobile Menu Navigation Handler
        document.addEventListener('DOMContentLoaded', () => {
            const menuBtn = document.getElementById('mobile-menu-btn');
            const mainNav = document.getElementById('main-nav');

            if (menuBtn && mainNav) {
                menuBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isExpanded = menuBtn.getAttribute('aria-expanded') === 'true';
                    menuBtn.classList.toggle('is-active');
                    mainNav.classList.toggle('is-open');
                    menuBtn.setAttribute('aria-expanded', !isExpanded);
                });

                // Auto-close menu drawer when a link is clicked
                const navLinks = mainNav.querySelectorAll('a');
                navLinks.forEach(link => {
                    link.addEventListener('click', () => {
                        menuBtn.classList.remove('is-active');
                        mainNav.classList.remove('is-open');
                        menuBtn.setAttribute('aria-expanded', 'false');
                    });
                });

                document.addEventListener('click', (e) => {
                    if (mainNav.classList.contains('is-open') && !mainNav.contains(e.target) && !menuBtn.contains(e.target)) {
                        menuBtn.classList.remove('is-active');
                        mainNav.classList.remove('is-open');
                        menuBtn.setAttribute('aria-expanded', 'false');
                    }
                });
            }
        });
    </script>

    <!-- Native ES Module Bootstrapper (Cukup Dipanggil 1 Kali) -->
    <script type="module" src="assets/js/index.js"></script>
</body>

</html>
