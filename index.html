<!DOCTYPE html>
<html lang="id" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TopCare AI — Platform Coach AI untuk Kepribadian</title>

    <!-- Favicon Integration -->
    <link rel="icon" type="image/svg+xml" href="assets/images/icons/topcare-logo.svg">

    <!-- SINGLE SOURCE OF TRUTH MASTER STYLESHEET BUNDLE (SSOT) -->
    <link rel="stylesheet" href="assets/css/app.css">

    <!-- Di bagian Header index.html -->

</head>

<body class="app-shell">

    <a href="#app" class="skip-link">Lewati ke konten utama</a>

    <!-- Global Application Header Navigation -->
    <header class="header-section" role="banner">
        <div class="header-container">
            <!-- Brand Logo -->
            <a href="#/home" class="header-brand" aria-label="TopCare AI Beranda">
                <img src="assets/images/icons/topcare-logo.svg" alt="TopCare AI Logo" class="header-logo">
            </a>

            <!-- Navigasi Utama (Bahasa Indonesia) -->
            <nav class="header-nav" id="main-nav" aria-label="Navigasi Utama">
                <a href="#/home" class="header-nav-link active">Beranda</a>
                <a href="#features" class="header-nav-link">AI Coach</a>
                <a href="#/personality" class="header-nav-link">Tes Kepribadian</a>
                <a href="#/learning" class="header-nav-link">Belajar</a>
                <a href="#/prompt" class="header-nav-link">Prompt AI</a>
                <a href="#/community" class="header-nav-link">Komunitas</a>
                <a href="#/premium" class="header-nav-link">Premium</a>
                <a href="#/about" class="header-nav-link">Tentang Kami</a>
            </nav>

            <!-- Aksi & Pemilih Bahasa -->

            <div class="header-actions">
                <!-- Tombol Pemilih Bahasa -->
                <div class="lang-selector">
                    <button class="lang-btn" id="lang-toggle-btn" aria-label="Pilih Bahasa">
                        <span>🇮🇩 ID</span>
                    </button>
                </div>

                <a href="#/login" class="header-nav-link" data-i18n="nav_login">Masuk</a>
                <a href="#/register" class="btn-primary" data-i18n="nav_register">Mulai Gratis</a>
            </div>

            <!-- Tombol Garis 3 untuk HP / Tablet -->
            <button class="mobile-menu-toggle" id="mobile-menu-btn" aria-label="Buka Menu Navigasi"
                aria-expanded="false">
                <span class="hamburger-bar"></span>
                <span class="hamburger-bar"></span>
                <span class="hamburger-bar"></span>
            </button>
        </div>
    </header>

    <!-- SINGLE DYNAMIC MOUNT POINT FOR THE RUNTIME SHELL -->
    <main id="app" class="app-view-viewport" role="main"></main>

    <!-- Script Sederhana Ringan untuk Toggle Mobile Menu & Bahasa -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuBtn = document.getElementById('mobile-menu-btn');
            const mainNav = document.getElementById('main-nav');
            const langBtn = document.getElementById('lang-toggle-btn');

            // Toggle Garis 3 HP/Tablet
            if (menuBtn && mainNav) {
                menuBtn.addEventListener('click', () => {
                    const isOpen = mainNav.classList.toggle('is-open');
                    menuBtn.setAttribute('aria-expanded', isOpen);
                });
            }

            // Toggle Bahasa (ID / EN)
            if (langBtn) {
                let currentLang = 'ID';
                langBtn.addEventListener('click', () => {
                    currentLang = currentLang === 'ID' ? 'EN' : 'ID';
                    langBtn.querySelector('span').textContent = currentLang === 'ID' ? '🇮🇩 ID' : '🇬🇧 EN';
                });
            }
        });
    </script>

    <!-- Native ES Module Bootstrapper -->
    <script type="module" src="assets/js/index.js"></script>

</body>

</html>
